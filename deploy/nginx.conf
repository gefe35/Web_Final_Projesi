# /etc/nginx/sites-available/gefeblog
# gefeblog.twinshareapp.com — Nginx reverse proxy

server {
    listen 80;
    server_name gefeblog.twinshareapp.com;

    # Let's Encrypt doğrulama için
    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    # HTTP → HTTPS yönlendirmesi
    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    server_name gefeblog.twinshareapp.com;

    # SSL — certbot bu satırları otomatik dolduracak
    ssl_certificate     /etc/letsencrypt/live/gefeblog.twinshareapp.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/gefeblog.twinshareapp.com/privkey.pem;
    include             /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam         /etc/letsencrypt/ssl-dhparams.pem;

    # Güvenlik başlıkları
    add_header X-Frame-Options        "SAMEORIGIN"           always;
    add_header X-Content-Type-Options "nosniff"              always;
    add_header Referrer-Policy        "strict-origin"        always;

    client_max_body_size 20M;

    # Gunicorn'a aktar
    location / {
        proxy_pass         http://127.0.0.1:8000;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }

    # Media dosyaları doğrudan Nginx'ten sun (hız)
    location /media/ {
        alias /opt/gefeblog/backend/media/;
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    # Favicon
    location = /favicon.ico {
        proxy_pass http://127.0.0.1:8000;
        access_log off;
    }
}
